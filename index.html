<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Vision Snap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="max-w-md mx-auto flex items-center justify-center space-x-2">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <h1 class="text-xl font-bold text-gray-900">IA Vision Snap</h1>
        </div>
    </header>

    <main class="flex-grow max-w-md mx-auto w-full p-4 flex flex-col space-y-6">

        <!-- Tarjeta de la clave de Gemini -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <label for="apiKeyInput" class="block text-sm font-semibold text-gray-800 mb-2">Clave de Gemini</label>
            <div id="keyForm" class="flex space-x-2">
                <input id="apiKeyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
                       placeholder="Pega aquí tu clave"
                       class="flex-1 min-w-0 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="saveKeyBtn" type="button"
                        class="bg-gray-900 hover:bg-gray-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition duration-300">
                    Guardar
                </button>
            </div>
            <div id="keySaved" class="hidden">
                <div class="flex items-center justify-between">
                    <p class="text-sm text-green-700 font-medium">Clave guardada en este dispositivo</p>
                    <button id="changeKeyBtn" type="button" class="text-sm text-blue-600 hover:text-blue-800 font-semibold">Cambiar</button>
                </div>
            </div>
        </div>

        <!-- Tarjeta de subida -->
        <div class="bg-white rounded-2xl shadow-md p-6 text-center">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <button id="uploadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-300 flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/30">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
                <span>Subir / Tomar Foto de Libro</span>
            </button>
        </div>

        <!-- Vista Previa -->
        <div id="previewContainer" class="hidden bg-white rounded-2xl shadow-md overflow-hidden relative">
            <img id="imagePreview" src="" alt="Vista previa" class="w-full h-64 object-cover">
            <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/80 flex flex-col items-center justify-center backdrop-blur-sm">
                <div class="loader mb-3"></div>
                <p class="text-sm font-semibold text-blue-600 animate-pulse">Analizando con Gemini...</p>
            </div>
        </div>

        <!-- Resultado Actual -->
        <div id="resultContainer" class="hidden bg-white rounded-2xl shadow-md p-6 space-y-4 border-2 border-blue-500">
            <div>
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Último Libro Generado</h2>
                <h3 id="resultTitle" class="text-xl font-bold text-gray-900 leading-tight"></h3>
            </div>
            <div class="h-px bg-gray-100 w-full"></div>
            <div>
                <p id="resultSynopsis" class="text-gray-700 text-sm leading-relaxed"></p>
            </div>
        </div>

        <!-- Historial de Firebase -->
        <div class="bg-white rounded-2xl shadow-md p-6 space-y-4">
            <h2 class="text-lg font-bold text-gray-900 border-b pb-2">Libros Guardados</h2>
            <div id="historialLista" class="space-y-4">
                <p class="text-sm text-gray-500">Cargando...</p>
            </div>
        </div>

        <!-- Errores -->
        <div id="errorContainer" class="hidden bg-red-50 border border-red-200 rounded-2xl p-4 text-center">
            <p id="errorMessage" class="text-sm text-red-600 font-medium"></p>
            <p id="errorDetail" class="text-xs text-red-400 mt-2 break-words"></p>
        </div>

    </main>

    <!-- Script principal como Módulo -->
    <script type="module">
        // 1. IMPORTACIONES DE FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // 2. CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCXyqPSAPOfOlB2vFBY-vKWKAiovDcQwz4",
            authDomain: "prueba-1-ff8ed.firebaseapp.com",
            projectId: "prueba-1-ff8ed",
            storageBucket: "prueba-1-ff8ed.firebasestorage.app",
            messagingSenderId: "65575177647",
            appId: "1:65575177647:web:905b36443bfe0f6a01335a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 3. CONFIGURACIÓN GEMINI
        const MODELS = ['gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3.5-flash'];
        const STORAGE_KEY = 'gemini_vision_snap_api_key';
        const MAX_IMAGE_SIDE = 1600; 

        // Elementos UI
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const changeKeyBtn = document.getElementById('changeKeyBtn');
        const keyForm = document.getElementById('keyForm');
        const keySaved = document.getElementById('keySaved');
        const imageInput = document.getElementById('imageInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultSynopsis = document.getElementById('resultSynopsis');
        const errorContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');
        const errorDetail = document.getElementById('errorDetail');
        const historialLista = document.getElementById('historialLista');

        // Manejo de Clave Gemini
        let currentKey = localStorage.getItem(STORAGE_KEY) || '';
        function showKeyState() {
            if (currentKey) {
                keyForm.classList.add('hidden');
                keySaved.classList.remove('hidden');
            } else {
                keyForm.classList.remove('hidden');
                keySaved.classList.add('hidden');
            }
        }
        showKeyState();

        saveKeyBtn.addEventListener('click', () => {
            const value = apiKeyInput.value.trim().replace(/^["']|["']$/g, '');
            if (!value) return;
            currentKey = value;
            localStorage.setItem(STORAGE_KEY, value);
            apiKeyInput.value = '';
            showKeyState();
        });

        changeKeyBtn.addEventListener('click', () => {
            currentKey = '';
            localStorage.removeItem(STORAGE_KEY);
            showKeyState();
        });

        // Cargar historial de Firebase al inicio
        async function cargarHistorial() {
            try {
                // Pide los libros ordenados por fecha de creación (los más nuevos primero)
                const q = query(collection(db, "libros"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);
                
                historialLista.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    historialLista.innerHTML = '<p class="text-sm text-gray-500">Aún no hay libros guardados.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = 'border-b border-gray-100 pb-3';
                    item.innerHTML = `
                        <h4 class="font-bold text-gray-900">${data.titulo}</h4>
                        <p class="text-sm text-gray-600 mt-1">${data.sinopsis}</p>
                    `;
                    historialLista.appendChild(item);
                });
            } catch (error) {
                console.error("Error cargando historial:", error);
                // Si el índice requiere crearse, Firebase tirará error por el 'orderBy' la primera vez, 
                // para simplificar lo cargamos sin ordenar si falla el índice:
                try {
                    const fallbackSnapshot = await getDocs(collection(db, "libros"));
                    historialLista.innerHTML = ''; 
                    fallbackSnapshot.forEach((doc) => {
                        const data = doc.data();
                        historialLista.innerHTML += `
                            <div class="border-b border-gray-100 pb-3">
                                <h4 class="font-bold text-gray-900">${data.titulo}</h4>
                                <p class="text-sm text-gray-600 mt-1">${data.sinopsis}</p>
                            </div>
                        `;
                    });
                } catch(e) {
                    historialLista.innerHTML = '<p class="text-sm text-red-500">Error al cargar la base de datos.</p>';
                }
            }
        }
        
        cargarHistorial(); // Llama a la función nada más cargar la página

        // Subida de imagen
        uploadBtn.addEventListener('click', () => {
            if (!currentKey) return;
            imageInput.click();
        });

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            errorContainer.classList.add('hidden');
            resultContainer.classList.add('hidden');

            // Preparar imagen
            const objectUrl = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.naturalWidth * scale);
                canvas.height = Math.round(img.naturalHeight * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const base64 = dataUrl.split(',')[1];
                
                imagePreview.src = dataUrl;
                previewContainer.classList.remove('hidden');
                
                analyzeImageWithGemini(base64, 'image/jpeg');
            };
            img.src = objectUrl;
        });

        async function analyzeImageWithGemini(base64Data, mimeType) {
            loadingOverlay.classList.remove('hidden');
            uploadBtn.disabled = true;

            const promptText = "Analiza esta imagen con mucho detalle. Genera un título creativo y una sinopsis completa. Devuelve el resultado ESTRICTAMENTE en formato JSON: { \"titulo\": \"...\", \"sinopsis\": \"...\" }";

            const payload = {
                contents: [{
                    role: "user",
                    parts: [{ text: promptText }, { inlineData: { mimeType: mimeType, data: base64Data } }]
                }],
                generationConfig: { responseMimeType: "application/json" }
            };

            try {
                let response = null;
                for (let i = 0; i < MODELS.length; i++) {
                    response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODELS[i]}:generateContent`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': currentKey },
                        body: JSON.stringify(payload)
                    });
                    if (response.status !== 404) break;
                }

                if (!response.ok) throw new Error("Fallo en la API");
                const result = await response.json();
                
                const parts = result.candidates[0].content.parts;
                let jsonString = parts.filter(p => p.text && !p.thought).map(p => p.text).join('').trim();
                jsonString = jsonString.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
                
                const parsedData = JSON.parse(jsonString);

                // Mostrar en pantalla
                resultTitle.textContent = parsedData.titulo;
                resultSynopsis.textContent = parsedData.sinopsis;
                resultContainer.classList.remove('hidden');

                // GUARDAR EN FIREBASE
                await addDoc(collection(db, "libros"), {
                    titulo: parsedData.titulo,
                    sinopsis: parsedData.sinopsis,
                    fecha: serverTimestamp()
                });

                // Actualizar la lista visible abajo
                cargarHistorial();

            } catch (error) {
                console.error(error);
                errorMessage.textContent = "Error al analizar o guardar.";
                errorContainer.classList.remove('hidden');
            } finally {
                loadingOverlay.classList.add('hidden');
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
